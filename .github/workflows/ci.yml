name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Pushing three times in a minute should not leave three builds racing each
# other. The only run worth finishing is the one for the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The model is pure Rust with no desktop behind it, so it runs anywhere and
  # runs fast. Kept as its own job because it is the part worth knowing about
  # first when something breaks.
  model:
    name: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p incredibulk-core -- -D warnings
      - run: cargo test -p incredibulk-core

  linux:
    name: build and test on linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: install native dependencies
        run: bash tools/setup-linux.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: build and test on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: test update data preservation
        shell: powershell
        run: ./tools/update-windows.tests.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # A release build takes longer than everything above put together and
      # proves nothing the debug build has not already proven. It runs when a
      # version is tagged, which is when the binary is actually wanted.
      - name: build the release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build -p incredibulk --release

      - name: upload the release binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: incredibulk-windows-x64
          path: target/release/incredibulk.exe
          if-no-files-found: error
