name: Idea
description: Something it should do that it does not.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. What you were collecting, and what got
        in the way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough idea is fine.
