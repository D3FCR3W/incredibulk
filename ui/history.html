<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Incredibulk history</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <h1>History</h1>
          <p id="subtitle">Past sessions, newest first.</p>
        </div>
        <div class="actions">
          <button id="clear">Clear all</button>
        </div>
      </header>

      <div class="search-bar">
        <label for="search">Search history</label>
        <input id="search" type="text" placeholder="Name, content, file path or source…" autocomplete="off" spellcheck="false" aria-controls="list" />
        <button id="reset-search" hidden>Clear search</button>
        <span id="search-status" role="status" aria-live="polite"></span>
      </div>

      <div class="columns">
        <div class="list scroll" id="list"></div>

        <aside class="preview-pane">
          <h2>What would be pasted</h2>
          <pre class="preview" id="preview"></pre>
        </aside>
      </div>

      <p class="note" id="note"></p>

      <footer>
        <button class="primary" id="paste" disabled>Paste selected</button>
        <button id="copy" disabled>Copy without pasting</button>
        <button id="deselect" disabled>Deselect all</button>
        <span class="spacer"></span>
        <button id="forget" disabled>Delete selected</button>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script src="shortcut.js"></script>
    <script src="history.js"></script>
  </body>
</html>
